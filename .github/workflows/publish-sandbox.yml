name: Publish Sandbox Image

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'packages/sandbox/**'
      - '.github/workflows/publish-sandbox.yml'
      - 'scripts/sandbox-smoke.sh'
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic version to publish (without v prefix)'
        required: true
        default: '0.4.1'
      push_latest:
        description: 'Also tag the image as :latest'
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-sandbox-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: airlock-sandbox
  SANDBOX_CONTEXT: ./packages/sandbox

jobs:
  meta:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
      version: ${{ steps.meta.outputs.version }}
      push_latest: ${{ steps.meta.outputs.push_latest }}
      publish: ${{ steps.meta.outputs.publish }}

    steps:
      - name: Resolve release version
        id: meta
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
            PUSH_LATEST="${{ inputs.push_latest }}"
            PUBLISH=true
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            PUSH_LATEST=true
            PUBLISH=true
          else
            VERSION="pr-${{ github.event.pull_request.number }}"
            PUSH_LATEST=false
            PUBLISH=false
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] && [[ "$PUBLISH" == "true" ]]; then
            echo "::error::Invalid version '$VERSION'. Use semver like 0.3.1 or tag v0.3.1."
            exit 1
          fi

          OWNER="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${OWNER}/${IMAGE_NAME}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "push_latest=$PUSH_LATEST" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "Target ${IMAGE}:${VERSION} (publish=${PUBLISH})"

  build:
    name: Build (${{ matrix.platform }})
    needs: meta
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            slug: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            slug: arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: needs.meta.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push sandbox image
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.SANDBOX_CONTEXT }}
          file: ${{ env.SANDBOX_CONTEXT }}/Dockerfile
          push: ${{ needs.meta.outputs.publish == 'true' }}
          load: ${{ needs.meta.outputs.publish != 'true' && matrix.slug == 'amd64' }}
          platforms: ${{ matrix.platform }}
          tags: |
            ${{ needs.meta.outputs.publish == 'true' && format('{0}:{1}-{2}', needs.meta.outputs.image, needs.meta.outputs.version, matrix.slug) || format('airlock/sandbox:pr-test-{0}', matrix.slug) }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=airlock-sandbox-${{ matrix.slug }}
          cache-to: type=gha,mode=max,scope=airlock-sandbox-${{ matrix.slug }}

  manifest:
    name: Publish multi-arch manifest
    needs: [meta, build]
    if: needs.meta.outputs.publish == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create version manifest
        run: |
          docker buildx imagetools create \
            -t "${{ needs.meta.outputs.image }}:${{ needs.meta.outputs.version }}" \
            "${{ needs.meta.outputs.image }}:${{ needs.meta.outputs.version }}-amd64" \
            "${{ needs.meta.outputs.image }}:${{ needs.meta.outputs.version }}-arm64"

      - name: Push latest tag
        if: needs.meta.outputs.push_latest == 'true'
        run: |
          docker buildx imagetools create \
            -t "${{ needs.meta.outputs.image }}:latest" \
            "${{ needs.meta.outputs.image }}:${{ needs.meta.outputs.version }}"

  smoke:
    name: Smoke Test Published Image
    needs: [meta, manifest]
    if: needs.meta.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pull published amd64 image
        run: |
          docker pull --platform linux/amd64 \
            "${{ needs.meta.outputs.image }}:${{ needs.meta.outputs.version }}"

      - name: Run sandbox smoke test
        env:
          AIRLOCK_SANDBOX_IMAGE: ${{ needs.meta.outputs.image }}:${{ needs.meta.outputs.version }}
        run: bash scripts/sandbox-smoke.sh

  smoke-pr:
    name: Smoke Test PR build (amd64)
    needs: [meta, build]
    if: needs.meta.outputs.publish != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run sandbox smoke test
        env:
          AIRLOCK_SANDBOX_IMAGE: airlock/sandbox:pr-test-amd64
        run: bash scripts/sandbox-smoke.sh
